<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Eco Pontos Curitiba</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- tipografia -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <!-- Bootstrap CSS local -->
        <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- CSS -->
        <link href="style.css" rel="stylesheet">
    </head>

    <body class="bg-light">

        <!-- Navbar -->
        <nav class="navbar navbar-light bg-white py-3 shadow-sm position-relative" style="z-index: 20;">
            <div class="container-fluid px-4 px-lg-5">
                <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                    <!-- Ícone  -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" 
                        class="bi bi-recycle text-success" viewBox="0 0 16 16">

                    <!-- mb-0 e fs-4 consertam a margem padrão da tag h2 dentro de links -->
                    <h2 class="mb-0 fs-4 fw-bold text-brand-dark">EcoPontos Curitiba</h2>
                </a>
            </div>
        </nav>

        <!-- Conteúdo principal -->
    <!-- Conteúdo principal -->
<main class="container-fluid p-0 app-wrapper">
    <!-- Adicionada a classe app-row e removido o h-100 -->
    <div class="row g-0 app-row">

        <!-- Col esquerda (em baixo no mobile, à esquerda no pc) -->
        <div class="col-md-4 bg-white p-4 p-lg-5 sidebar-container d-flex flex-column shadow-sm order-2 order-md-1" style="z-index: 10;">            <!-- cabeçalho da coluna -->
            <div class="mb-4">
                <p class="text-success fw-bold text-uppercase small mb-2" style="letter-spacing: 1px;">Uma cidade mais sustentável</p>
                <h2 class="fw-bold mb-3 text-brand-dark">Locais próximos</h2>
                <p class="text-muted">Encontre os pontos de coleta mais próximos de você.</p>
            </div>

            <!-- barra de pesquisa -->
            <input type="text" class="form-control form-control-lg mb-4 search-box border-0" style="background-color: #e2e8f0; border-radius: 8px;" placeholder="Digite o bairro:">
            
            <!-- lista dinâmica -->
            <div class="list-group list-group-flush mt-2 flex-grow-1">
                <h6 class="text-muted mb-3">Ecopontos (12)</h6>
                <a href="#" class="list-group-item list-group-item-action py-3 px-0 border-bottom">
                    <h6 class="mb-1 fw-bold text-brand-dark">Exemplo 1</h6>
                    <small class="text-muted">Água Verde</small>
                </a>
                <a href="#" class="list-group-item list-group-item-action py-3 px-0 border-bottom">
                    <h6 class="mb-1 fw-bold text-brand-dark">Exemplo 2</h6>
                    <small class="text-muted">Matriz</small>
                </a>
            </div>

            <!-- mini rodapé -->
            <div class="mt-auto pt-3 border-top text-muted small d-flex justify-content-between align-items-center">
                <span>&copy; EcoPontos Curitiba</span>
                <span>Projeto Acadêmico &middot; <a href="https://github.com/EcoPontosCuritiba" target="_blank" class="text-success text-decoration-none fw-bold">GitHub</a></span>
            </div>
        </div>

        <!-- Col direita (por cima no mobile, à direita no pc) --> 
        <div class="col-md-8 position-relative map-container order-1 order-md-2">            <div id="div-do-mapa" class="w-100 h-100 d-flex align-items-center justify-content-center" style="background-color: #e2e8f0;">
                <span class="text-muted fs-5">O Mapa interativo (Leaflet) preencherá este espaço</span>
            </div>
        </div>

    </div>
</main>

        <!-- Bootstrap JavaScript -->
        <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
